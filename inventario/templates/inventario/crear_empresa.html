{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Empresa</title>
    <link rel="stylesheet" href="{% static 'css/sitde.css' %}">
    <link rel="stylesheet" href="{% static 'css/inventario/inventario.css' %}">
</head>
<body>
    <div class="contenedor-inventario">
        <h1 class="titulo-inventario">Registrar Nueva Empresa</h1>

        <form method="post" class="formulario-inventario">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="boton boton-primario">Guardar Empresa</button>
        </form>

        <p style="margin-top: 1.5rem;">
            <a href="{% url 'lista_empresas' %}">← Volver a la lista de empresas</a>
        </p>
    </div>
</body>
</html>
