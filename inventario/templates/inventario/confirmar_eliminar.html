{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Eliminación</title>
    <link rel="stylesheet" href="{% static 'css/sitde.css' %}">
    <link rel="stylesheet" href="{% static 'css/inventario/inventario.css' %}">
</head>
<body>
    <div class="contenedor-inventario">
        <h1 class="titulo-inventario">¿Eliminar {{ tipo }}?</h1>

        <p>¿Estás seguro de que deseas eliminar <strong>"{{ objeto }}"</strong>? Esta acción no se puede deshacer.</p>

        <form method="post" style="margin-top: 1.5rem; display: flex; gap: 1rem;">
            {% csrf_token %}
            <button type="submit" class="btn-accion btn-eliminar" style="cursor: pointer;">Sí, Eliminar</button>
            
            {% if tipo == 'Empresa' %}
                <a href="{% url 'lista_empresas' %}" class="btn-accion" style="background-color: #e2e8f0; color: #334155; text-decoration: none;">Cancelar</a>
            {% else %}
                <a href="{% url 'lista_productos' %}" class="btn-accion" style="background-color: #e2e8f0; color: #334155; text-decoration: none;">Cancelar</a>
            {% endif %}
        </form>
    </div>
</body>
</html>
